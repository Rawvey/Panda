<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Les détours de Bao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: the living forest fills the screen; Bao's needs top-left, sound top-right;
     thumb pads in the bottom corners; one care button rises in the middle when Bao asks. */
  --moss:#20352a;
  --leaf:#a9c98a;
  --paper:#f7f1df;
  --bark:#6b4f37;
  --ink:#23302a;
  --seal:#b4432f;
  --warm:#e39a5b;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--moss);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff6c8;outline-offset:3px}
[hidden]{display:none!important}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:rgba(247,241,223,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(10,28,18,.24);border:1px solid rgba(255,255,255,.6)}

#hud{position:fixed;z-index:4;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:8px}
#needs{display:flex;gap:8px}
.need{width:52px;height:52px;border-radius:50%;padding:0;position:relative;display:grid;place-items:center}
.need .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.need .ring circle{fill:none;stroke-width:4}
.need .ring .bg{stroke:rgba(35,48,42,.12)}
.need .ring .fg{stroke:#6c9a55;stroke-linecap:round;stroke-dasharray:138.2;transition:stroke-dashoffset .6s,stroke .6s}
.need.low .ring .fg{stroke:var(--warm)}
.need.low{animation:pulse 1.8s ease-in-out infinite}
.need.nope{animation:nope .4s}
.need .ico{width:27px;height:27px}
#trail{position:relative;height:5px;width:172px;border-radius:9px;background:rgba(247,241,223,.35);overflow:visible}
#trail i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:var(--paper);transition:width .3s}
#trail b{position:absolute;right:-4px;top:-5px;width:15px;height:15px;border-radius:50%;background:var(--leaf);border:2px solid var(--paper)}

#sound{position:fixed;z-index:4;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
  width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center}
#sound svg{width:24px;height:24px}
#sound[aria-pressed="true"] .wave{display:none}
#sound[aria-pressed="false"] .cross{display:none}

#sign{position:fixed;z-index:3;left:50%;top:18%;transform:translate(-50%,8px);text-align:center;pointer-events:none;opacity:0;
  transition:opacity 1.2s,transform 1.2s;color:var(--paper);text-shadow:0 2px 18px rgba(0,0,0,.45);width:min(90vw,520px)}
#sign.on{opacity:1;transform:translate(-50%,0)}
#sign small{display:block;font:800 12px var(--body);letter-spacing:.2em;text-transform:uppercase;opacity:.85}
#sign b{display:block;font:italic 500 clamp(30px,7vw,48px)/1.05 var(--display);text-wrap:balance}

#bubble{position:fixed;z-index:5;left:0;top:0;padding:11px 18px 12px;border-radius:22px;font:italic 500 clamp(20px,4.6vw,26px)/1.1 var(--display);
  white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .35s}
#bubble.on{opacity:1}
#bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:18px;height:18px;margin-left:-9px;background:inherit;transform:rotate(45deg);
  border-right:1px solid rgba(255,255,255,.6);border-bottom:1px solid rgba(255,255,255,.6)}

#pad{position:fixed;z-index:4;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));transition:opacity .4s,transform .4s}
#pad.off{opacity:0;transform:translateY(30px)}
#pad.off .pb{pointer-events:none}
.pads{display:flex;gap:12px}
.pb{pointer-events:auto;width:76px;height:76px;border-radius:50%;padding:0;display:grid;place-items:center;touch-action:none;transition:transform .08s,background .15s}
.pb svg{width:34px;height:34px}
.pb.down{transform:scale(.92);background:rgba(255,252,238,.95)}
#bJ{width:92px;height:92px}
#bJ svg{width:40px;height:40px}
#bJ .climb{display:none}
#bJ.climbable .jump{display:none}
#bJ.climbable .climb{display:block}
#bJ.climbable{background:rgba(214,234,190,.92)}

#care{position:fixed;z-index:6;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translate(-50%,140%);display:flex;align-items:center;gap:14px;
  padding:14px 28px 14px 18px;border-radius:999px;border:0;background:var(--paper);color:var(--ink);font:800 clamp(17px,4.4vw,21px) var(--body);
  box-shadow:0 10px 34px rgba(8,26,15,.38);transition:transform .55s cubic-bezier(.2,1.3,.4,1);white-space:nowrap}
#care.on{transform:translate(-50%,0);animation:breathe 2.2s ease-in-out 1s infinite}
#care svg{width:44px;height:44px;flex:none;border-radius:50%;background:#e2ebd2;padding:7px}

#film{position:fixed;inset:0;z-index:9;background:#0b120e;opacity:0;transition:opacity .8s}
#film.on{opacity:1}
#filmCv{width:100%;height:100%;display:block}
#fortune{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:rgba(14,30,21,.62);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadeIn .5s}
#fortune .panel{display:flex;flex-direction:column;align-items:center;width:min(100%,420px)}
#cookie{position:relative;width:min(70vw,270px);aspect-ratio:1;border:0;background:none;padding:0;animation:drop .8s cubic-bezier(.3,1.5,.5,1)}
#cookie img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35))}
#cookie .cB{opacity:0;transform:scale(.8)}
#cookie.wait .cA{animation:wobble 1.6s ease-in-out infinite}
#cookie.open .cA{animation:crackA .5s ease-in forwards}
#cookie.open .cB{animation:crackB .6s .25s cubic-bezier(.2,1.4,.4,1) forwards}
#paper{margin-top:-34px;position:relative;z-index:1;background:linear-gradient(180deg,#fffdf4,#f3ecd6);color:var(--seal);border-radius:3px;
  padding:16px 22px 15px;width:min(92vw,380px);box-shadow:0 8px 24px rgba(0,0,0,.28);transform:scaleX(0);opacity:0;
  text-align:center;display:flex;align-items:center;gap:12px}
#fortune.revealed #paper{animation:unroll .8s .55s cubic-bezier(.2,1,.3,1) forwards}
#msg{margin:0;flex:1;font:italic 500 clamp(19px,4.8vw,23px)/1.3 var(--display);text-wrap:balance}
#speak{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(180,67,47,.1);color:var(--seal);display:grid;place-items:center;padding:0}
#speak svg{width:20px;height:20px}
#resume{margin-top:22px;display:flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 30px;background:var(--leaf);color:var(--moss);
  font:800 19px var(--body);box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);pointer-events:none}
#resume svg{width:22px;height:22px}
#fortune.revealed #resume{animation:rise .5s 1.5s forwards;pointer-events:auto}

#title{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;
  background:radial-gradient(ellipse at 50% 42%,rgba(20,40,28,.15),rgba(12,26,18,.72));transition:opacity .8s}
#title.gone{opacity:0;pointer-events:none}
#title h1{margin:0;color:var(--paper);text-align:center;font:italic 500 clamp(40px,11vw,76px)/.95 var(--display);text-shadow:0 4px 30px rgba(0,0,0,.5);text-wrap:balance}
#title h1 span{display:block;font:800 clamp(13px,3vw,16px) var(--body);font-style:normal;letter-spacing:.32em;text-transform:uppercase;margin-bottom:12px;opacity:.85}
#play{border:0;border-radius:999px;padding:16px 44px;background:var(--paper);color:var(--moss);font:800 22px var(--body);display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 34px rgba(0,0,0,.4);animation:breathe 2.4s ease-in-out infinite}
#play svg{width:24px;height:24px}
#loading{color:var(--paper);font:800 14px var(--body);letter-spacing:.2em;opacity:.8}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes breathe{0%,100%{box-shadow:0 10px 34px rgba(8,26,15,.38)}50%{box-shadow:0 10px 34px rgba(8,26,15,.38),0 0 0 9px rgba(247,241,223,.28)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes drop{from{transform:translateY(-60vh) rotate(-30deg)}}
@keyframes wobble{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}}
@keyframes crackA{40%{transform:scale(1.08) rotate(4deg)}100%{opacity:0;transform:scale(1.1) rotate(-3deg)}}
@keyframes crackB{from{opacity:0;transform:scale(.8) rotate(-6deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes unroll{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-height:520px){.pb{width:62px;height:62px}#bJ{width:74px;height:74px}.need{width:44px;height:44px}#trail{width:148px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

<canvas id="game" aria-label="Bao le panda dans la forêt"></canvas>

<div id="hud">
  <div id="needs">
    <button class="need glass" data-need="faim" aria-label="Donner du bambou à Bao">
      <svg class="ring" viewBox="0 0 52 52"><circle class="bg" cx="26" cy="26" r="22"/><circle class="fg" cx="26" cy="26" r="22"/></svg>
      <svg class="ico" viewBox="0 0 28 28"><path d="M11 26V3" stroke="#5f8f43" stroke-width="5" stroke-linecap="round"/><path d="M8.5 10h5M8.5 18h5" stroke="#3d6b2f" stroke-width="1.6"/><path d="M13 9c4-4 8-5 12-4-3 3-7 5-12 4z" fill="#7fb04f"/><path d="M13 17c3-2 7-2 10 0-3 2-7 2-10 0z" fill="#6a9a40"/></svg>
    </button>
    <button class="need glass" data-need="jeu" aria-label="Faire jouer Bao avec ses amis">
      <svg class="ring" viewBox="0 0 52 52"><circle class="bg" cx="26" cy="26" r="22"/><circle class="fg" cx="26" cy="26" r="22"/></svg>
      <svg class="ico" viewBox="0 0 28 28" fill="#2b2826"><ellipse cx="14" cy="18.5" rx="6.2" ry="5.2"/><ellipse cx="6.5" cy="11.5" rx="2.6" ry="3.2"/><ellipse cx="11" cy="6.8" rx="2.6" ry="3.2"/><ellipse cx="17" cy="6.8" rx="2.6" ry="3.2"/><ellipse cx="21.5" cy="11.5" rx="2.6" ry="3.2"/></svg>
    </button>
    <button class="need glass" data-need="sommeil" aria-label="Faire faire la sieste à Bao">
      <svg class="ring" viewBox="0 0 52 52"><circle class="bg" cx="26" cy="26" r="22"/><circle class="fg" cx="26" cy="26" r="22"/></svg>
      <svg class="ico" viewBox="0 0 28 28"><path d="M19 4a10 10 0 1 0 6 16A11 11 0 0 1 19 4z" fill="#56689e"/><circle cx="21" cy="7" r="1.2" fill="#e9c66b"/><circle cx="24.5" cy="12" r=".9" fill="#e9c66b"/></svg>
    </button>
  </div>
  <div id="trail" aria-hidden="true"><i><b></b></i></div>
</div>

<button id="sound" class="glass" aria-pressed="false" aria-label="Couper le son">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="cross" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<div id="sign" aria-live="polite"><small id="signNum"></small><b id="signName"></b></div>
<div id="bubble" class="glass" aria-live="polite"></div>

<div id="pad" class="off">
  <div class="pads">
    <button class="pb glass" id="bL" aria-label="Aller à gauche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="pb glass" id="bR" aria-label="Aller à droite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <button class="pb glass" id="bJ" aria-label="Sauter ou grimper">
    <svg class="jump" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19c2-8 6-12 10-12s5 3 6 5"/><path d="M15.5 3.5L14 7l3.6 1"/></svg>
    <svg class="climb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 11l6-6 6 6"/></svg>
  </button>
</div>

<button id="care"><svg viewBox="0 0 28 28" id="careIco"></svg><span id="careTxt"></span></button>

<div id="film" hidden><canvas id="filmCv" aria-label="Un moment tranquille avec Bao"></canvas></div>
<div id="fortune" hidden>
  <div class="panel">
    <button id="cookie" class="wait" aria-label="Ouvrir le biscuit"><img class="cA" alt=""><img class="cB" alt=""></button>
    <div id="paper"><p id="msg"></p><button id="speak" aria-label="Lire le message à voix haute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/></svg></button></div>
    <button id="resume"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Reprendre</button>
  </div>
</div>

<div id="title">
  <h1><span>Les détours de</span>Bao</h1>
  <div id="loading">…</div>
  <button id="play" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Jouer</button>
</div>

  if(k==='faim') bambooDrop={x:bao.x+bao.face*70,y:cam.y-120,vy:0,rot:-.4,vr:2.2,landed:false,t:0};

function doGate(){ setSt('gate'); bao.vx=0; sfx.fanfare(); for(let i=0;i<40;i++) parts.push({k:'spark',x:bao.x+rr(-160,160),y:bao.y-rr(20,260),vx:rr(-20,20),vy:rr(-50,-10),life:0,max:rr(1.4,2.6),s:rr(3,6)}); }

// Is there walkable ground for `dist` units in direction `dir`? Clumsy moves only slide or roll where there is room.
function roomAhead(dir,dist){
  for(let d=20;d<=dist;d+=20){ const x=bao.x+dir*d; let okk=false;
    for(const p of LV.plats){ if(x>=p.x0-10&&x<=p.x1+10&&abs(surf(p,clamp(x,p.x0,p.x1))-bao.y)<30){okk=true;break;} }
    if(!okk) return false; }
  return true;
}
function clumsyPick(){
  const g=bao.ground, f=bao.face, wide=g&&(g.k==='g'||g.k==='b');
  const o=[['faceplant',roomAhead(f,70)?3:0],['buttslide',roomAhead(f,150)?(g&&g.moss?4:2):0],['roll',wide?.8:0],['butterfly',1.6],['sneeze',roomAhead(-f,110)?1.4:0]];
  let tot=0; for(const q of o) tot+=q[1]; let r=rnd()*tot; for(const q of o){ r-=q[1]; if(r<=0) return q[0]; } return 'faceplant';
}
function startClumsy(kind){
  const b=bao; b.flag=0; b.hold=0;
  if(kind==='faceplant'){ setSt('faceplant'); sfx.oops(); say('Oups !',1); }
  else if(kind==='buttslide'){ b.vx=b.face*Math.max(abs(b.vx),130)*1.1; setSt('buttslide'); sfx.wah(); say('Wouh !',1); }
  else if(kind==='roll'){ startRoll(-b.face,rr(1.2,2.8),true,false); }
  else if(kind==='butterfly'){ setSt('butterfly'); bfly.mode='tease'; }
  else { setSt('sneeze'); sfx.sneezeIn(); }
}
function startRoll(dir,dur,plop,quiet){
  const b=bao; b.rollDir=dir; b.rollLeft=dur; b.rolling=true; b.rollIntro=plop?.45:0; b.gig=.3; setSt('roll');
  if(!quiet){ say('Wiii !',1.2); sfx.wiii(); }
}
function getUp(){ const b=bao; b.rolling=false; b.getA=Math.atan2(sin(b.rollA),cos(b.rollA)); b.rollA=0; b.vx=0; setSt('getup'); }
function updBao(dt){
  const b=bao; b.t+=dt;
  const dir=(K.R?1:0)-(K.L?1:0), play=G.mode==='play';
  for(const p of LV.plats) if(p.k==='r'){ const tg=b.ground===p?1:0; p.dv+=((tg-p.dip)*55-p.dv*6)*dt; p.dip+=p.dv*dt; }
  switch(b.st){
  case 'idle': case 'walk': {
    if(!play) break;
    if(K.Jp){ const tr=trunkNear(); if(tr){ startClimb(tr); break; }
      b.vy=-JUMP; b.fallFrom=b.y; b.ground=null; setSt('air'); sfx.jump(); kick(-.18,.22); break; }
    if(dir){ b.hold+=dt; if(dir!==b.face){b.hold=0;} b.face=dir; } else b.hold=Math.max(0,b.hold-dt*3);
    const g=b.ground, slick=g&&g.moss, trot=clamp((b.hold-1.1)/.6,0,1), vmax=lerp(WALK,TROT,trot);
    if(dir) b.vx=approach(b.vx,dir*vmax,(slick?520:1000)*dt); else b.vx=approach(b.vx,0,(slick?240:1300)*dt);
    b.x+=b.vx*dt; walls(); followGround(true);
    if(b.st!=='idle'&&b.st!=='walk') break;
    b.st=abs(b.vx)>18?'walk':'idle';
    const p0=b.ph; b.ph+=abs(b.vx)*.046*dt; if(Math.floor(p0/Math.PI)!==Math.floor(b.ph/Math.PI)) sfx.step();
    if(g&&g.k==='r'&&abs(b.vx)>40&&rnd()<dt*.8) sfx.creak();
    // clumsiness: hurrying, wobbling planks and an unhappy panda all make him trip
    const rate=(.036+.07*clumsy())*(1+trot*4)*((g&&(g.k==='r'||g.moss))?1.9:1)*(G.lvl===0?.9:1);
    b.calm=(b.calm||0)+dt;
    if(abs(b.vx)>60&&G.sinceSpawn>2.5&&b.calm>3.2&&rnd()<rate*dt){ b.calm=0; startClumsy(clumsyPick()); break; }
    if(b.st==='idle'&&!dir){ b.idleT+=dt; if(b.idleT>11&&b.ground&&b.ground.k!=='r'){ b.idleT=0; b.gig=1; setSt('lounge'); sfx.giggle(); break; } } else b.idleT=0;
    checkLanterns();
    if(b.x>=LV.gate&&b.ground){ doGate(); break; }
    checkNeed();
    break; }
  case 'air': {
    if(b.rolling){ b.rollA+=b.vx*dt/48; }
    else { if(dir) b.face=dir; const vt=dir*Math.max(WALK,abs(b.vx)); b.vx=approach(b.vx,vt,(dir?650:120)*dt); }
    b.vy=Math.min(b.vy+GRAV*dt,1500);
    const y0=b.y; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.vy>0){ const p=landOn(b.x,y0,b.y); if(p){ land(p); break; } }
    walls(y0);
    if(K.Jp&&play&&!b.rolling){ const tr=trunkNear(); if(tr){ startClimb(tr); break; } }
    if(b.y-b.fallFrom>230&&!b.flail&&!b.rolling){ b.flail=1; sfx.wah(); }
    if(b.y>=WATER-6) splash();
    break; }
  case 'climb': {
    const t=b.trunk; b.x=approach(b.x,b.tx,420*dt);
    if(dir===-b.face&&play){ b.face=dir; b.vx=dir*180; b.vy=-430; b.fallFrom=b.y; b.trunk=null; setSt('air'); sfx.jump(); break; }
    if(K.J&&play){ b.y-=CLIMB*dt; const c0=b.cph; b.cph+=dt*7.5; if(Math.floor(c0/Math.PI)!==Math.floor(b.cph/Math.PI)) sfx.scratch();
      if(b.t>.6&&rnd()<(.05+.14*clumsy())*dt){ setSt('slide'); sfx.oops(); break; } }
    if(b.y<=t.top+2){ if(findAt(t.x,t.top,30)){ b.pull=[b.x,b.y]; setSt('pullup'); } else { b.y=t.top+2;
      if(dir===b.face&&play){ b.vx=b.face*190; b.vy=-560; b.fallFrom=b.y; b.trunk=null; setSt('air'); sfx.jump(); } } }
    break; }
  case 'slide': {
    b.y=Math.min(b.climbY0,b.y+lerp(170,30,b.t/.7)*dt);
    if(b.t>.75) setSt('climb');
    break; }
  case 'pullup': {
    const t=b.trunk, k=ease(b.t/.45); b.x=lerp(b.pull[0],t.x+b.face*8,k); b.y=lerp(b.pull[1],t.top,k)-sin(k*Math.PI)*34;
    if(b.t>=.45){ b.y=t.top; b.ground=findAt(b.x,t.top,30); b.trunk=null; kick(.2,-.25); sfx.land(); setSt('idle'); if(!b.ground){ b.fallFrom=b.y; setSt('air'); } }
    break; }
  case 'faceplant': {
    b.vx=approach(b.vx,0,260*dt); b.x+=b.vx*dt; walls(); followGround(false); if(b.st!=='faceplant') break;
    if(b.t>.3&&!b.flag){ b.flag=1; sfx.plop(); dust(b.x+b.face*30,b.y,.6); kick(.3,-.3); }
    if(b.t>1.5) setSt('idle'); break; }
  case 'buttslide': {
    const slick=b.ground&&b.ground.moss; b.vx=approach(b.vx,0,(b.t<.35?60:(slick?90:200))*dt); b.x+=b.vx*dt; walls(); followGround(false); if(b.st!=='buttslide') break;
    if(b.t>.35&&!b.flag){ b.flag=1; sfx.plop(); dust(b.x,b.y,.7); }
    if(b.t>1.35&&abs(b.vx)<30){ b.getA=0; setSt('getup'); } break; }
  case 'roll': {
    if(b.rollIntro>0){ b.rollIntro-=dt; b.vx=approach(b.vx,0,600*dt); if(b.rollIntro<=0){ sfx.plop(); dust(b.x,b.y,.5); } }
    else { b.rollLeft-=dt; b.vx=approach(b.vx,b.rollLeft>0?b.rollDir*215:0,(b.rollLeft>0?520:280)*dt); b.rollA+=b.vx*dt/48;
      b.gig-=dt; if(b.gig<0&&b.rollLeft>0){ b.gig=rr(.7,1.1); sfx.giggle(); } }
    const wx=b.x+b.vx*dt; b.x=wx; walls(); if(abs(b.x-wx)>.5) b.rollLeft=Math.min(b.rollLeft,0);
    followGround(false); if(b.st!=='roll') break;
    if(b.rollIntro<=0&&b.rollLeft<=0&&abs(b.vx)<10) getUp();
    break; }
  case 'getup': if(b.t>.62) setSt('idle'); break;
  case 'butterfly': {
    b.vx=approach(b.vx,0,500*dt); b.x+=b.vx*dt; walls(); followGround(false); if(b.st!=='butterfly'){ bfly.mode='free'; break; }
    if(b.t>.55&&b.flag===0){ b.flag=1; say('Oh !',1); sfx.flutter(); }
    if(b.t>1.95&&b.flag===1){ b.flag=2; sfx.plop(); dust(b.x,b.y,.5); bfly.mode='belly'; }
    if(b.t>2.25&&b.flag===2){ b.flag=3; sfx.giggle(); }
    if(b.t>2.95&&b.flag===3){ b.flag=4; bfly.mode='free'; bfly.tt=0; }
    if(b.t>3.4) setSt('idle'); break; }
  case 'sneeze': {
    if(b.t<.9) b.vx=approach(b.vx,0,500*dt);
    if(b.t>=.9&&!b.flag){ b.flag=1; sfx.sneeze(); say('Atchoum !',1.1); b.vx=-b.face*170; kick(.4,-.4); const hx=b.x+b.face*60, hy=b.y-80;
      for(let i=0;i<10;i++) parts.push({k:'puff',x:hx+rr(-8,8),y:hy+rr(-6,8),vx:b.face*rr(40,160),vy:rr(-50,40),life:0,max:rr(.5,1),s:rr(6,14)}); }
    if(b.t>=.9) b.vx=approach(b.vx,0,200*dt);
    b.x+=b.vx*dt; walls(); followGround(false); if(b.st!=='sneeze') break;
    if(b.t>1.2&&b.flag===1){ b.flag=2; sfx.plop(); dust(b.x,b.y,.5); }
    if(b.t>2.5) setSt('idle'); break; }
  case 'lounge': {
    if(play&&(dir||K.Jp)){ b.getA=0; getUp(); b.getA=0; break; }
    b.gig-=dt; if(b.gig<0){ b.gig=rr(2.5,4.5); sfx.giggle(); }
    break; }
  case 'teeter': {
    if(play&&dir===-b.tSide&&b.t>.12){ b.x-=b.tSide*28; b.vx=-b.tSide*70; b.hold=0; sfx.phew(); setSt('walk'); break; }
    if((play&&dir===b.tSide&&b.t>.3)||(b.t>1.6&&b.tFate==='fall')){ b.ground=null; b.fallFrom=b.y; b.vy=-160; b.vx=b.tSide*70; b.flail=0; setSt('air'); break; }
    if(b.t>1.6){ b.x-=b.tSide*22; sfx.phew(); setSt('idle'); }
    break; }
  case 'bump': if(b.t>.95) setSt('idle'); break;
  case 'splash': {
    b.x+=b.vx*dt; if(b.t>1.0) G.fadeT=1; if(b.t>1.7) respawn(); break; }
  case 'shake': {
    if(b.t<.9&&rnd()<.6) parts.push({k:'drop',x:b.x+rr(-50,50),y:b.y-rr(30,90),vx:rr(-240,240),vy:rr(-260,-80),life:0,max:rr(.4,.8),s:rr(2,4)});
    if(b.t>1.05) setSt('idle'); break; }
  case 'need': case 'rest': break;
  case 'care': updCare(dt); break;
  case 'gate': if(b.t>2.6) G.fadeT=1; if(b.t>3.4) startLevel(G.lvl+1); break;
  }
  if(b.st!=='air') b.flail=0;
  // squash spring
  b.svx+=((1-b.sx)*260-b.svx*14)*dt; b.sx+=b.svx*dt; b.svy+=((1-b.sy)*260-b.svy*14)*dt; b.sy+=b.svy*dt;
  K.Jp=0;
}
function updCare(dt){
  const b=bao, t=b.t;
  if(b.care==='faim'){
    const s=bambooDrop;
    if(s&&!s.landed){ s.vy+=1800*dt; s.y+=s.vy*dt; s.rot+=s.vr*dt; if(s.y>=b.y-10){ s.y=b.y-10; s.landed=true; sfx.plop(); dust(s.x,b.y,.4); } }
    if(t>1.0&&s) bambooDrop=null;
    if(t>1.0&&((t*1.8)|0)!==(((t-dt)*1.8)|0)) sfx.munch();
    if(t>1.0&&rnd()<dt*3) parts.push({k:'crumb',x:b.x+b.face*30,y:b.y-95,vx:rr(-50,50),vy:rr(-80,-20),life:0,max:1,s:rr(2,4)});
    if(t>6.2) openFortune('faim');
  } else if(b.care==='jeu'){
    for(const f of friendsPlay){
      if(!f.landed){ f.vy+=1700*dt; f.y+=f.vy*dt; f.rot+=dt*8; if(f.y>=b.y){ f.y=b.y; f.landed=true; f.rot=0; sfx.plop(); dust(f.x,f.y,.7); } }
      else if(t>6.0){ if(!f.gone){ f.gone=true; f.vy=-1100; f.vx=-f.face*80; sfx.jump(); } f.vy+=900*dt; f.y+=f.vy*dt; f.x+=f.vx*dt; f.rot+=dt*5*f.face; }
    }
    if(t>1.6&&t<6&&((t*1.3)|0)!==(((t-dt)*1.3)|0)) sfx.giggle();
    if(t>8.0){ friendsPlay=[]; openFortune('jeu'); }
  } else {
    G.napK=t<1?ease(t):t<5.6?1:1-ease((t-5.6)/1);
    if(t>1.3&&((t/2.2)|0)!==(((t-dt)/2.2)|0)){ sfx.snore(); parts.push({k:'z',x:b.x+b.face*50,y:b.y-90,vx:12*b.face,vy:-24,life:0,max:3,s:rr(22,30)}); }
    if(t>7.4){ G.napK=0; openFortune('sommeil'); }
  }
}

/* ── Bao's look ── */
function look(dt){
  const b=bao, t=G.time, P=newP(); let pose='walk', rot=0, pivot=0, yoff=0, clipY=null, xoff=0;
  P.breath=.012*sin(t*2.3);
  const lean=b.face;
  switch(b.st){
  case 'idle': {
    P.heads[0]=[.05*sin(t*.7)+.03*sin(t*1.9),0,0]; P.limbs=[.04*sin(t*1.1),0,-.04*sin(t*1.1),0];
    if(b.ground&&b.ground.k==='r') rot=.03*sin(t*2.4);
    break; }
  case 'walk': {
    const trot=clamp((b.hold-1.1)/.6,0,1), A=.3+.16*trot, ph=b.ph;
    P.limbs=[A*sin(ph),A*sin(ph+Math.PI*.5),A*sin(ph+Math.PI),0];
    P.heads[0]=[.04*sin(ph*2),0,.004*sin(ph*2)]; yoff=-(3+3*trot)*abs(sin(ph)); rot=lean*(.025*sin(ph)+.06*trot); pivot=40;
    break; }
  case 'air': {
    if(b.rolling){ pose='tumble'; rot=b.rollA; pivot=48; P.limbs=[.3,.2,.35,.35]; }
    else if(b.flail){ pose='slip'; const f=13; P.limbs=[.5*sin(t*f),.5*sin(t*f+1.3),.45*sin(t*f*1.1+2),.4*sin(t*f*.9+3)]; P.heads[1]=[0,0,.006*sin(t*20)]; rot=.25*sin(t*6); pivot=70; }
    else { P.limbs=[.65,.45,-.6,0]; rot=lean*clamp(b.vy/2400,-.16,.22); pivot=45; P.heads[0]=[clamp(b.vy/3000,-.1,.12),0,0]; }
    break; }
  case 'climb': case 'slide': {
    pose='climb'; const c=b.cph, mv=b.st==='slide'?0:1;
    if(b.st==='slide'){ pose='slip'; P.limbs=[.4*sin(t*14),.4*sin(t*15+1),.3*sin(t*12),.3*sin(t*13)]; rot=-lean*.15; pivot=60; }
    else { P.limbs=[.28*sin(c)*mv,-.28*sin(c)*mv,.14*sin(c)*mv,-.14*sin(c)*mv]; P.heads[0]=[.04*sin(c*.5),0,0]; yoff=-3*abs(sin(c)); }
    break; }
  case 'pullup': pose=b.t<.25?'climb':'walk'; P.limbs=pose==='climb'?[-.3,-.3,.2,-.2]:[.5,.3,-.4,0]; break;
  case 'faceplant': {
    if(b.t<.3){ pose='slip'; rot=lean*lerp(.1,1.0,b.t/.3); pivot=50; P.limbs=[.6*sin(t*16),.6*sin(t*15),.5*sin(t*14),.5*sin(t*13)]; P.heads[1]=[0,0,.008]; }
    else if(b.t<1.05){ pose='tumble'; const k=(b.t-.3)/.75; rot=Math.PI+.1*sin(k*16)*(1-k); pivot=45; yoff=-6; P.limbs=[.3*sin(t*11)*(1-k),.2*sin(t*9),.35*sin(t*10+1),.35*sin(t*12)]; }
    else { const k=(b.t-1.05)/.45; P.limbs=[.2,0,-.2,0]; P.heads[0]=[.28*sin(k*18)*(1-k),0,0]; }
    break; }
  case 'buttslide': {
    if(b.t<.35){ pose='slip'; const k=b.t/.35; rot=-lean*lerp(0,.5,k); pivot=55; yoff=-22*sin(k*Math.PI); P.limbs=[.6*sin(t*16),.6*sin(t*16+1),.5*sin(t*14),.5*sin(t*13)]; P.heads[1]=[0,0,.009]; }
    else { pose='tumble'; rot=-lean*(.06+.04*sin(t*9)); pivot=45; yoff=4; const m=clamp(abs(b.vx)/120,0,1); P.limbs=[.35*sin(t*7),.25*sin(t*8),.4*sin(t*9)*(.3+m),.4*sin(t*10)*(.3+m)]; P.heads[1]=[0,0,.006]; }
    break; }
  case 'roll': case 'lounge': {
    pose='tumble'; pivot=48;
    if(b.st==='lounge'){ rot=.38*sin(t*1.7); yoff=2; P.limbs=[.45*sin(t*5),.3*sin(t*4+1),.5*sin(t*5+2),.5*sin(t*4.5+3)]; P.heads[0]=[.08*sin(t*1.7),0,0]; P.heads[1]=[0,0,.006*(1+sin(t*3))]; }
    else if(b.rollIntro>0){ const k=1-b.rollIntro/.45; pose=k<.5?'slip':'tumble'; rot=-lean*lerp(0,.4,k); pivot=50; P.limbs=[.5*sin(t*15),.5*sin(t*14),.4*sin(t*13),.4*sin(t*12)]; }
    else { rot=b.rollA; P.limbs=[.3,.2,.35,.35]; P.heads[1]=[0,0,.008]; }
    break; }
  case 'getup': {
    if(b.t<.3&&abs(b.getA)>.05){ pose='tumble'; rot=b.getA*(1-ease(b.t/.3)); pivot=48; }
    else { const k=clamp((b.t-.3)/.32,0,1); P.heads[0]=[.3*sin(k*20)*(1-k),0,0]; P.limbs=[.15*sin(t*20)*(1-k),0,-.15*sin(t*20)*(1-k),0]; }
    break; }
  case 'butterfly': {
    const tt=b.t;
    if(tt<.6){ const k=tt/.6; P.heads[0]=[-.24*k,0,-.006*k]; }
    else if(tt<1.95){ pose='climb'; const k=clamp((tt-.6)/1.35,0,1); P.limbs=[.5*sin(t*12),-.5*sin(t*12+1),.12*sin(t*6),-.12*sin(t*6)]; rot=lean*.16*sin(t*5)*k; pivot=0; yoff=-abs(sin(t*6))*9; P.heads[0]=[-.12,0,0]; }
    else if(tt<2.25){ pose='slip'; const k=(tt-1.95)/.3; rot=-lean*lerp(.2,1.0,k); pivot=40; P.limbs=[.6*sin(t*15),.6*sin(t*14),.4*sin(t*13),.4*sin(t*12)]; P.heads[1]=[0,0,.01]; }
    else if(tt<3.0){ pose='tumble'; rot=-lean*.05; pivot=45; yoff=4; P.limbs=[.4*sin(t*5),.3*sin(t*4),.45*sin(t*5+1),.45*sin(t*4+2)]; P.heads[1]=[0,0,.006*(1+sin(t*6))]; }
    else { const k=(tt-3)/.4; P.heads[0]=[.25*sin(k*18)*(1-k),0,0]; }
    break; }
  case 'sneeze': {
    const tt=b.t;
    if(tt<.9){ const k=ease(tt/.9); P.heads[0]=[-.26*k+.03*sin(t*30)*k,0,-.004*k]; P.heads[1]=[0,0,.012*k]; rot=-lean*.07*k; pivot=40; }
    else if(tt<1.2){ pose='slip'; rot=-lean*.55; pivot=50; yoff=-16*sin((tt-.9)/.3*Math.PI); P.limbs=[.6*sin(t*16),.6*sin(t*15),.4*sin(t*14),.4*sin(t*13)]; P.heads[1]=[0,0,.01]; }
    else if(tt<1.9){ pose='tumble'; rot=-lean*.08; pivot=45; yoff=4; P.limbs=[.3*sin(t*6),.2*sin(t*5),.35*sin(t*6+1),.35*sin(t*5+2)]; }
    else { const k=(tt-1.9)/.6; P.heads[0]=[.3*sin(k*20)*(1-k),0,0]; }
    break; }

}
function showSign(){
  $('signNum').textContent='Tableau '+(G.lvl+1); $('signName').textContent=LV.name;
  const s=$('sign'); s.classList.add('on'); clearTimeout(showSign.t); showSign.t=setTimeout(()=>s.classList.remove('on'),3200);
}
/* fortune cookie */
const fortuneEl=$('fortune'), cookieEl=$('cookie');
cookieEl.querySelector('.cA').src=ASSET.cookieA; cookieEl.querySelector('.cB').src=ASSET.cookieB;
let cookieTimer=0;
function openFortune(k){
  G.mode='cookie'; G.need[k]=1; G.sinceCare=0; setSt('rest'); bambooDrop=null;
  const msg=MSGS[G.cookies%MSGS.length]; G.cookies++;
  $('msg').textContent=msg; fortuneEl.classList.remove('revealed'); cookieEl.className='wait'; fortuneEl.hidden=false;
  sfx.plop(); clearTimeout(cookieTimer); cookieTimer=setTimeout(crackCookie,3400);
  setTimeout(()=>{try{cookieEl.focus({preventScroll:true})}catch(e){}},300); save();
}
function crackCookie(){
  if(cookieEl.classList.contains('open')) return; clearTimeout(cookieTimer);
  cookieEl.className='open'; fortuneEl.classList.add('revealed'); sfx.crack(); setTimeout(()=>sfx.chime(G.cookies),500);
  setTimeout(()=>{try{$('resume').focus({preventScroll:true})}catch(e){}},1700);
}
cookieEl.addEventListener('click',crackCookie);
$('resume').addEventListener('click',()=>{ if(!fortuneEl.classList.contains('revealed')) return; fortuneEl.hidden=true; endFilm(); G.mode='play'; bao.care=null; setSt('idle'); padOn(true); try{speechSynthesis.cancel()}catch(e){} });
if(!('speechSynthesis' in window)) $('speak').hidden=true;
$('speak').addEventListener('click',()=>{ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance($('msg').textContent); u.lang='fr-FR'; u.rate=.85; u.pitch=1.05; speechSynthesis.speak(u);}catch(e){} });
/* sound */
const soundEl=$('sound');
soundEl.addEventListener('click',()=>{ A.on=!A.on; soundEl.setAttribute('aria-pressed',String(!A.on)); soundEl.setAttribute('aria-label',A.on?'Couper le son':'Remettre le son'); audioInit(); if(A.ctx) A.master.gain.setTargetAtTime(A.on?.9:0,A.ctx.currentTime,.15); });
/* Phones: Web Audio only starts inside a tap, iPhones mute it with the side switch,
   and it can stay 'interrupted' after a call or sleep. Every tap re-checks it. */
let keepAlive=null;
function silentWav(){
  const n=8000, buf=new ArrayBuffer(44+n), v=new DataView(buf), w=(o,t)=>{for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i));};
  w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function unlockAudio(){
  if(G.mode==='title'&&!A.ctx) return;
  audioInit(); const c=A.ctx; if(!c) return;
  try{ if(navigator.audioSession&&navigator.audioSession.type!=='playback') navigator.audioSession.type='playback'; }catch(e){}
  if(c.state!=='running'){ c.resume().catch(()=>{});
    try{ const b=c.createBuffer(1,1,22050), src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0); }catch(e){} }
  {
    try{ if(!keepAlive){ keepAlive=document.createElement('audio'); keepAlive.src=silentWav(); keepAlive.loop=true; keepAlive.setAttribute('playsinline',''); keepAlive.setAttribute('aria-hidden','true'); keepAlive.style.display='none'; document.body.appendChild(keepAlive); }
      if(keepAlive.paused&&!document.hidden){ const pr=keepAlive.play(); if(pr&&pr.catch) pr.catch(()=>{}); } }catch(e){}
  }
}
['touchend','pointerup','click','keydown'].forEach(n=>document.addEventListener(n,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(A.ctx) A.ctx.suspend().catch(()=>{}); if(keepAlive) try{keepAlive.pause()}catch(e){} }
  else if(A.ctx&&G.mode!=='title'){ A.ctx.resume().catch(()=>{}); }
});

/* ═════════════ Flow ═════════════ */
function save(){ try{localStorage.setItem('bao-v2',JSON.stringify({lvl:G.lvl,need:G.need,cookies:G.cookies}))}catch(e){} }
function startLevel(i){
  G.lvl=i; buildLevel(i); bao.prev=null; friendsPlay=[]; bambooDrop=null; parts.length=0; G.night=LV.grade.night;
  respawn(); setSt('idle'); G.fade=1; G.fadeT=0; if(G.mode!=='title') showSign(); save();
}
function loop(ms){
  requestAnimationFrame(loop);
  const tt=ms/1000, dt=Math.min(.05,Math.max(.001,tt-(loop.last||tt))); loop.last=tt;
  if(!LV) return;
  G.time+=dt; G.sinceSpawn+=dt; G.shake=Math.max(0,G.shake-dt*1.5);
  const active=G.mode==='play'&&{idle:1,walk:1,air:1,climb:1,slide:1,pullup:1,teeter:1,bump:1,shake:1,faceplant:1,buttslide:1,roll:1,getup:1,butterfly:1,sneeze:1,lounge:1}[bao.st];
  if(active){ G.sinceCare+=dt; for(const k of NEEDS) G.need[k]=Math.max(0,G.need[k]-DECAY[k]*dt); }
  if(G.mode!=='title'&&!G.paused) updBao(dt);
  if(bao.bubbleT>0){ bao.bubbleT-=dt; if(bao.bubbleT<=0) hideSay(); }
  updCam(dt);
  G.fade+=((G.fadeT)-G.fade)*Math.min(1,dt*(G.fadeT?4:2.2));
  updFly(dt,G.time);
  if(rnd()<dt*.45) parts.push({k:'petal',x:cam.x+rr(-60,VW),y:cam.y-20,vx:rr(4,24),vy:rr(22,40),r:rnd()*6,life:0,max:16,s:rr(3.5,6),ph:rnd()*6,c:['#f9d3dc','#f4b9c8','#fde9ee'][(rnd()*3)|0]});
  if(rnd()<dt*.25) parts.push({k:'leaf',x:cam.x+rr(0,VW),y:cam.y-20,vx:rr(-14,14),vy:rr(30,55),r:rnd()*6,life:0,max:14,s:rr(14,24),ph:rnd()*6,c:['#7fb04f','#c9b45a','#6a9a40'][(rnd()*3)|0]});
  if(film.on){ film.t+=dt; if(G.mode==='film'&&film.t>=film.dur&&!film.done){ film.done=true; openFortune(film.k); } if(!G.noRender) drawFilm(dt); }
  if(!G.noRender&&!(film.on&&film.t>1)) render(dt); placeBubble(); updHud(dt);
}
function start(d){
  NOISE=noiseCanvas(); buildLayers();
  if(GLR) for(const k of POSES) if(IM[k]) GLR.texture(k,IM[k]);
  let s=d&&d.lvl!=null?d:null; if(!s){ try{s=JSON.parse(localStorage.getItem('bao-v2')||'null')}catch(e){s=null} }
  if(s){ G.lvl=s.lvl|0; if(s.need) for(const k of NEEDS) if(typeof s.need[k]==='number') G.need[k]=clamp(s.need[k],.45,1); G.cookies=s.cookies|0; }
  resize(); startLevel(G.lvl); G.fade=.0;
  $('loading').hidden=true; $('play').hidden=false;
  requestAnimationFrame(loop);
}
$('play').addEventListener('click',()=>{ audioInit(); unlockAudio(); $('title').classList.add('gone'); G.mode='play'; padOn(true); showSign(); setTimeout(()=>{$('title').hidden=true},900); });
let rz=0; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(resize,100); });
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({lvl:G.lvl,need:G.need,cookies:G.cookies}));
loadAll().then(()=>{ if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{}); });
window.__bao={A,film,startFilm,dbg:{drawPanda,newP,RIG,GLR,IM,step:(dt)=>{G.time+=dt;G.sinceSpawn+=dt;updBao(dt);},platAt,surf,bfly,startClumsy:(k,d)=>{ if(k==='roll') startRoll(-bao.face,d||3,true,false); else startClumsy(k); }},G,bao,K,get LV(){return LV},startLevel,startNeed,startCare,crackCookie,openFortune,snapCam,GLR:!!GLR,cam};
})();
