<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Petit Panda — une forêt toute douce</title>
<style>
:root{
  /* One uninterrupted, touchable scene. The panda is the interface. */
  --mist:#e9f3e8;
  --jade:#6f9f7c;
  --bamboo:#7fb04f;
  --ink:#1f2a24;
  --fur:#f3eee3;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--mist);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.bar{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:3}
.rb{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.58);padding:0;display:grid;place-items:center;cursor:pointer;
  background:rgba(248,252,240,.56);color:#415c47;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 5px 22px rgba(46,85,57,.1)}
.rb svg{width:21px;height:21px}
.rb:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#mute[aria-pressed="true"] .wave{display:none}
#mute[aria-pressed="false"] .cross{display:none}
</style>
</head>
<body>
<canvas id="scene" aria-label="Un bébé panda joueur dans une forêt. Touche son ventre, sa tête, ses pattes ou le décor; fais glisser ton doigt pour le faire bouger."></canvas>

<div class="bar">
  <button class="rb" id="mute" aria-pressed="false" aria-label="Couper le son">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="cross" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
</div>

<script>
(() => {
'use strict';
const TAU=Math.PI*2, clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const ease=p=>{p=clamp(p,0,1);return p*p*(3-2*p)};
const sin=Math.sin, cos=Math.cos;
function rng32(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=Math.random, rr=(a,b)=>a+rnd()*(b-a);
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
let W=460,S=1,dpr=1,PX=230,PS=1,GY=860,SUNX=100,SUNY=150;

/* No achievement counter or written instructions: play has no objective. */
function discover(){ /* Kept as a harmless hook for the little gestures. */ }

/* ───────────────────────── Audio ───────────────────────── */
const A={ctx:null,on:true};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){
  if(A.ctx){ if(A.ctx.state==='suspended') A.ctx.resume().catch(()=>{}); return; }
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const c=A.ctx=new C();
    A.master=c.createGain(); A.master.gain.value=A.on?.68:0;
    const comp=c.createDynamicsCompressor(); A.master.connect(comp); comp.connect(c.destination);
    // reverb
    const len=(c.sampleRate*4.2)|0, ib=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);let y=0;for(let i=0;i<len;i++){const x=(rnd()*2-1)*Math.pow(1-i/len,2.8);y+=(x-y)*.32;d[i]=y*1.6;}}
    A.rev=c.createConvolver(); A.rev.buffer=ib; const rg=c.createGain(); rg.gain.value=.6; A.rev.connect(rg); rg.connect(A.master);
    A.music=c.createGain(); A.music.gain.value=0; A.music.connect(A.master); A.music.connect(A.rev);
    A.music.gain.linearRampToValueAtTime(.38,c.currentTime+7);
    A.padF=c.createBiquadFilter(); A.padF.type='lowpass'; A.padF.frequency.value=650; A.padF.connect(A.music);
    A.mel=c.createGain(); A.mel.connect(A.music);
    const dl=c.createDelay(1.5); dl.delayTime.value=.52; const fb=c.createGain(); fb.gain.value=.34;
    A.mel.connect(dl); dl.connect(fb); fb.connect(dl); const dg=c.createGain(); dg.gain.value=.5; dl.connect(dg); dg.connect(A.music);
    A.sfx=c.createGain(); A.sfx.gain.value=.5; A.sfx.connect(A.master); const ss=c.createGain(); ss.gain.value=.3; A.sfx.connect(ss); ss.connect(A.rev);
    // noise
    const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate), nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=rnd()*2-1; A.noise=nb;
    // wind
    const w=c.createBufferSource(); w.buffer=nb; w.loop=true; const wf=c.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=420; wf.Q.value=.5;
    const wg=c.createGain(); wg.gain.value=.022; const lfo=c.createOscillator(); lfo.frequency.value=.06; const lg=c.createGain(); lg.gain.value=.014;
    lfo.connect(lg); lg.connect(wg.gain); w.connect(wf); wf.connect(wg); wg.connect(A.master); w.start(); lfo.start();
    A.nextMel=c.currentTime+2.5; A.nextChord=c.currentTime+.2; A.nextBird=c.currentTime+5; A.ci=0; A.mi=3;
    setInterval(musicTick,400); musicTick();
  }catch(e){A.ctx=null}
}
const CHORDS=[[50,57,62,66],[47,54,59,62],[43,50,59,62],[50,57,62,66],[43,50,57,62],[45,52,57,64]];
const SCALE=[62,64,66,69,71,74,76,78,81];
function pluck(m,t,vel,bus){
  const c=A.ctx,f=mtof(m),g=c.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+3.4);
  [[1,1],[2,.2],[4,.05]].forEach(([k,a])=>{const o=c.createOscillator(),og=c.createGain();o.frequency.value=f*k;og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+3.5);});
  g.connect(bus||A.mel);
}
function musicTick(){
  const c=A.ctx; if(!c||c.state!=='running') return; const now=c.currentTime, nt=night();
  if(A.nextChord<now) A.nextChord=now+.1; if(A.nextMel<now) A.nextMel=now+.1; if(A.nextBird<now) A.nextBird=now+2;
  while(A.nextChord<now+1.5){
    const ch=CHORDS[A.ci++%CHORDS.length], t0=A.nextChord, dur=15;
    ch.forEach((m,i)=>{[-5,5].forEach(det=>{const o=c.createOscillator(),g=c.createGain();o.type=i?'triangle':'sine';o.frequency.value=mtof(m);o.detune.value=det;
      const v=i?.028:.05; g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+5);g.gain.setValueAtTime(v,t0+dur-3);g.gain.linearRampToValueAtTime(0,t0+dur+4);
      o.connect(g);g.connect(A.padF);o.start(t0);o.stop(t0+dur+4.2);});});
    A.nextChord+=dur;
  }
  while(A.nextMel<now+1.5){
    const t0=A.nextMel;
    if(rnd()>(nt>.5?.5:.28)){
      A.mi=clamp(A.mi+[-2,-1,-1,1,1,2][(rnd()*6)|0],0,SCALE.length-1);
      const tr=nt>.5?-12:0;
      pluck(SCALE[A.mi]+tr,t0,.16+rnd()*.06);
      if(rnd()<.25) pluck(SCALE[clamp(A.mi+2,0,SCALE.length-1)]+tr,t0+.6,.1);
    }
    A.nextMel+=[1.2,1.8,2.4,2.4,3.6,4.8][(rnd()*6)|0];
  }
  while(A.nextBird<now+1.5){
    const t0=A.nextBird;
    if(nt<.4){ const f=rr(2300,3600), n=2+((rnd()*3)|0); for(let i=0;i<n;i++) tone(t0+i*.13,.09,f*(1+i*.04),f*1.22,.022,'sine'); }
    else if(nt>.7){ for(let i=0;i<4;i++) tone(t0+i*.07,.035,4300,4300,.008,'sine'); }
    A.nextBird+=rr(5,13);
  }
}
function tone(t,dur,f0,f1,vol,type,bus){
  const c=A.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+Math.min(.02,dur*.3)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(bus||A.sfx); o.start(t); o.stop(t+dur+.05); return o;
}
function noise(t,dur,type,f0,f1,q,vol){
  const c=A.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(); s.buffer=A.noise; s.loop=true;
  f.type=type; f.Q.value=q; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+Math.min(.03,dur*.3)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(A.sfx); s.start(t,rnd()); s.stop(t+dur+.05);
}
const ok=()=>A.ctx&&A.ctx.state==='running';
const sfx={
  crunch(){ if(!ok())return; const t=A.ctx.currentTime; noise(t,.07,'bandpass',1900,1200,1.2,.11); noise(t+.06,.06,'bandpass',1400,900,1.2,.07); },
  munch(){ if(!ok())return; noise(A.ctx.currentTime,.05,'lowpass',700,400,.7,.035); },
  plop(){ if(!ok())return; const t=A.ctx.currentTime; tone(t,.22,120,45,.4,'sine'); noise(t,.12,'lowpass',400,150,.7,.12); },
  inhale(){ if(!ok())return; noise(A.ctx.currentTime,.8,'bandpass',900,2600,2,.035); },
  sneeze(){ if(!ok())return; const t=A.ctx.currentTime; noise(t,.22,'bandpass',2600,1500,.8,.28); tone(t,.2,900,1500,.1,'triangle'); tone(t+.16,.16,1400,700,.06,'triangle'); },
  giggle(){ if(!ok())return; const t=A.ctx.currentTime, b=rr(680,820); for(let i=0;i<6;i++) tone(t+i*.105,.085,b-i*32+rr(-15,15),(b-i*32)*.84,.1,'sine'); },
  bleat(){ if(!ok())return; const c=A.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain(); o.type='triangle';
    o.frequency.setValueAtTime(540,t); o.frequency.linearRampToValueAtTime(600,t+.08); o.frequency.linearRampToValueAtTime(450,t+.4);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.09,t+.04); g.gain.linearRampToValueAtTime(0,t+.42);
    l.frequency.value=27; lg.gain.value=.045; l.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(A.sfx); o.start(t); l.start(t); o.stop(t+.45); l.stop(t+.45); },
  chime(n){ if(!ok())return; const t=A.ctx.currentTime, m=SCALE[(n-1)%SCALE.length]+12; pluck(m,t,.2,A.music); pluck(m+7,t+.14,.14,A.music); },
  rustle(){ if(!ok())return; const t=A.ctx.currentTime; for(let i=0;i<5;i++) noise(t+i*.09+rnd()*.04,.14,'bandpass',rr(2500,4200),rr(1800,2600),.6,.035); },
  whoosh(){ if(!ok())return; const c=A.ctx,t=c.currentTime; noise(t,.5,'lowpass',250,1100,.8,.07); noise(t+.45,.6,'lowpass',1100,220,.8,.05); },
  yawn(){ if(!ok())return; const c=A.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain(); o.type='sine';
    o.frequency.setValueAtTime(380,t); o.frequency.linearRampToValueAtTime(560,t+.6); o.frequency.linearRampToValueAtTime(260,t+1.7);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.07,t+.5); g.gain.linearRampToValueAtTime(0,t+1.8); o.connect(g); g.connect(A.sfx); o.start(t); o.stop(t+1.9); },
  party(){ if(!ok())return; const t=A.ctx.currentTime; [62,66,69,74,78,81,86].forEach((m,i)=>pluck(m,t+i*.16,.17,A.music)); }
};

/* ───────────────────────── Time of day ───────────────────────── */
const PAL={
  dawn:{top:hex('#f6c6c2'),bot:hex('#fdeed8'),tint:hex('#ffeae4'),sun:hex('#ffe3c4'),n:0},
  day:{top:hex('#bfe0dc'),bot:hex('#eef5e6'),tint:hex('#ffffff'),sun:hex('#fffbe6'),n:0},
  dusk:{top:hex('#f0a380'),bot:hex('#fbdcab'),tint:hex('#ffdcc2'),sun:hex('#ffc890'),n:.15},
  night:{top:hex('#2a3670'),bot:hex('#7786b8'),tint:hex('#5f72ab'),sun:hex('#f4f1e4'),n:1}
};
const KEYS=[[0,'dawn'],[.10,'day'],[.48,'day'],[.58,'dusk'],[.68,'night'],[.92,'night'],[1,'dawn']];
let tod=.14, todGoal=null, cur={};
function pal(){
  let i=0; while(i<KEYS.length-2&&tod>=KEYS[i+1][0]) i++;
  const a=PAL[KEYS[i][1]], b=PAL[KEYS[i+1][1]], t=ease((tod-KEYS[i][0])/(KEYS[i+1][0]-KEYS[i][0]));
  cur={top:mix(a.top,b.top,t),bot:mix(a.bot,b.bot,t),tint:mix(a.tint,b.tint,t),sun:mix(a.sun,b.sun,t),n:lerp(a.n,b.n,t)};
}
const night=()=>cur.n||0;
function toggleNight(){ todGoal = night()<.5 ? .7 : .14; discover('moon'); lookHold={x:SUNX,y:SUNY,t:3}; }

/* ───────────────────────── Sprites (painted once) ───────────────────────── */
const Q=2;
function sprite(x0,y0,x1,y1,draw){
  const c=document.createElement('canvas'); c.width=(x1-x0)*Q; c.height=(y1-y0)*Q;
  const g=c.getContext('2d'); g.scale(Q,Q); g.translate(-x0,-y0); g.ox=x0; g.oy=y0; g.lineCap='round'; draw(g);
  return {c,x0,y0,w:x1-x0,h:y1-y0};
}
const blit=sp=>ctx.drawImage(sp.c,sp.x0,sp.y0,sp.w,sp.h);
function fur(g,path,o){
  const R=o.rng,cx=o.cx,cy=o.cy,grav=o.grav==null?.5:o.grav;
  const ins=(x,y)=>g.isPointInPath(path,(x-g.ox)*Q,(y-g.oy)*Q);
  g.fillStyle=o.base; g.fill(path);
  g.strokeStyle=o.base; g.lineWidth=(o.ew||1.15)*.8; g.beginPath();
  const N=Math.round(o.en*1.9);
  for(let i=0;i<N;i++){
    const a=(i+R())/N*TAU, ca=cos(a), sa=sin(a); let lo=0,hi=o.rmax;
    for(let k=0;k<11;k++){const m=(lo+hi)/2; ins(cx+ca*m,cy+sa*m)?lo=m:hi=m;}
    const bx=cx+ca*lo, by=cy+sa*lo, d=a+(R()-.5)*.9; let dx=cos(d), dy=sin(d)+grav; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
    const len=o.el*(.22+R()*.42);
    g.moveTo(bx-dx*3,by-dy*3); g.lineTo(bx+dx*len,by+dy*len);
  }
  g.stroke();
  if(o.shade){g.save(); g.clip(path); o.shade(g); g.restore();}
  const [bx0,by0,bx1,by1]=o.box;
  [[o.hi,o.hia],[o.lo,o.loa]].forEach(([col,al])=>{
    g.strokeStyle=col; g.globalAlpha=al*.74; g.lineWidth=.7; g.beginPath();
    for(let i=0;i<o.n;i++){
      const x=bx0+R()*(bx1-bx0), y=by0+R()*(by1-by0); if(!ins(x,y)) continue;
      const a=(o.ang?o.ang(x,y):Math.atan2(y-cy,x-cx))+(R()-.5)*.8; let dx=cos(a), dy=sin(a)+grav; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
      const len=o.il*(.35+R()*.75); g.moveTo(x,y); g.lineTo(x+dx*len,y+dy*len);
    }
    g.stroke();
  });
  g.globalAlpha=1;
}
function radial(g,x,y,r,c0,c1){const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,c0); gr.addColorStop(1,c1); return gr;}
const BLK='#1a1817';
const blackFur=(rng,o)=>Object.assign({base:BLK,hi:'#6a6058',hia:.32,lo:'#000',loa:.5,rng},o);
const SPR={};
function buildSprites(){
  const rng=rng32(7);
  SPR.torso=sprite(-180,-290,180,34,g=>{
    const p=new Path2D('M0,-258 C50,-260 92,-248 104,-205 C122,-160 150,-110 142,-55 C136,-10 80,8 0,8 C-80,8 -136,-10 -142,-55 C-150,-110 -122,-160 -104,-205 C-92,-248 -50,-260 0,-258Z');
    fur(g,p,{base:'#ebe4d6',cx:0,cy:-115,rmax:210,el:11,en:560,hi:'#ffffff',hia:.5,lo:'#a2988a',loa:.38,n:3000,il:9,box:[-150,-262,150,10],rng,
      shade:g=>{
        g.fillStyle=radial(g,-35,-140,190,'rgba(255,253,247,.95)','rgba(255,253,247,0)'); g.fillRect(-200,-300,400,340);
        const rim=g.createRadialGradient(0,-115,95,0,-115,175); rim.addColorStop(0,'rgba(112,100,84,0)'); rim.addColorStop(1,'rgba(112,100,84,.5)');
        g.fillStyle=rim; g.fillRect(-200,-300,400,340);
        const lg=g.createLinearGradient(0,-70,0,12); lg.addColorStop(0,'rgba(120,104,80,0)'); lg.addColorStop(1,'rgba(120,104,80,.55)');
        g.fillStyle=lg; g.fillRect(-200,-70,400,90);
        g.fillStyle=radial(g,0,-40,90,'rgba(214,196,160,.28)','rgba(214,196,160,0)'); g.fillRect(-200,-140,400,160);
      }});
    // black shoulder yoke
    g.save(); g.clip(p);
    const y=new Path2D('M-190,-300 L190,-300 L190,-124 C124,-150 74,-196 0,-198 C-74,-196 -124,-150 -190,-124Z');
    g.fillStyle=BLK; g.fill(y);
    g.fillStyle=radial(g,-30,-235,90,'rgba(95,86,78,.35)','rgba(95,86,78,0)'); g.fill(y);
    g.strokeStyle=BLK; g.lineWidth=1.5; g.beginPath();
    for(let i=0;i<340;i++){
      const x=-140+rng()*280; let lo=-262,hi=-100;
      for(let k=0;k<10;k++){const m=(lo+hi)/2; g.isPointInPath(y,(x-g.ox)*Q,(m-g.oy)*Q)?lo=m:hi=m;}
      const a=Math.PI/2+(rng()-.5)*.9, l=5+rng()*11; g.moveTo(x,lo-2); g.lineTo(x+cos(a)*l,lo+sin(a)*l);
    }
    g.stroke(); g.restore();
  });
  SPR.head=sprite(-135,-120,135,112,g=>{
    const p=new Path2D('M0,-88 C55,-90 100,-60 106,-8 C112,40 78,84 0,86 C-78,84 -112,40 -106,-8 C-100,-60 -55,-90 0,-88Z');
    fur(g,p,{base:'#eee8dc',cx:0,cy:0,rmax:150,el:9,en:480,grav:.38,hi:'#ffffff',hia:.5,lo:'#a69c8e',loa:.34,n:2200,il:8,box:[-110,-90,110,88],rng,
      shade:g=>{
        g.fillStyle=radial(g,-22,-38,120,'rgba(255,254,249,.95)','rgba(255,254,249,0)'); g.fillRect(-140,-120,280,240);
        const rim=g.createRadialGradient(0,0,70,0,0,118); rim.addColorStop(0,'rgba(112,100,84,0)'); rim.addColorStop(1,'rgba(112,100,84,.42)');
        g.fillStyle=rim; g.fillRect(-140,-120,280,240);
        g.fillStyle=radial(g,0,96,80,'rgba(118,104,86,.5)','rgba(118,104,86,0)'); g.fillRect(-140,10,280,110);
      }});
    for(const s of [-1,1]){
      const e=new Path2D(); e.ellipse(s*43,-6,23,31,-s*.52,0,TAU); e.ellipse(s*53,9,17,22,-s*.55,0,TAU);
      fur(g,e,blackFur(rng,{cx:s*46,cy:0,rmax:60,el:5,en:170,grav:.45,n:300,il:5,box:[s*46-40,-45,s*46+40,40],
        shade:g=>{g.fillStyle=radial(g,s*40,-18,30,'rgba(96,86,78,.3)','rgba(96,86,78,0)'); g.fillRect(-120,-60,240,120);}}));
    }
    // Soft round baby cheeks, with an almost imperceptible rosy warmth.
    for(const s of [-1,1]){
      g.fillStyle=radial(g,s*72,34,31,'rgba(241,161,153,.23)','rgba(241,161,153,0)');
      g.fillRect(s*72-33,1,66,67);
    }

  if(d(headPt(-42,-6),30)) return 'eyeL'; if(d(headPt(42,-6),30)) return 'eyeR';
  if(d(headPt(-82,-70),42)) return 'earL'; if(d(headPt(82,-70),42)) return 'earR';

const HELD=[{at:118,s:1,a:.75,l:58},{at:150,s:-1,a:.6,l:66},{at:152,s:1,a:.5,l:50},{at:186,s:-1,a:.8,l:60},{at:190,s:1,a:.55,l:70},{at:214,s:-1,a:.4,l:48}];
function drawBamboo(){

  HELD.forEach((h,i)=>{ if(h.at>Lh-8) return; ctx.fillStyle=i%2?'#6a9a4a':'#82b25a'; ctx.beginPath(); leafShape(ctx,x0+h.at,h.s*4,h.s*h.a,h.l,h.l*.12); ctx.fill(); });

function drawFace(){

      ctx.stroke();
    } else {
      const r=12.1*(1+wide*.21), ox=clamp(lx*3.8-s*cr*4.8,-4,4), oy=clamp(ly*3.3+cr*1.2,-4,4);

      ctx.fillStyle='rgba(255,255,255,.98)'; ctx.beginPath(); ctx.ellipse(ox-3.5,oy-4,3.6,4,0,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(ox+4,oy+3.2,1.6,0,TAU); ctx.fill();

function drawPanda(t){

  ctx.save(); ctx.scale(1+(br-1)*.5,br); blit(SPR.torso); ctx.restore();
  ctx.save(); ctx.translate(60,-64); ctx.rotate(.42+v('legR')); blit(SPR.leg); ctx.restore();
  ctx.save(); ctx.scale(-1,1); ctx.translate(60,-64); ctx.rotate(.42+v('legL')); blit(SPR.leg); ctx.restore();

  // head
  ctx.save(); ctx.translate(0,-235); ctx.rotate(v('hrot')); ctx.translate(v('hdx'),-68+v('hdy'));ctx.scale(1.105,1.105);
  ctx.save(); ctx.translate(-82,-68); ctx.rotate(v('earL')); blit(SPR.ear); ctx.restore();
  ctx.save(); ctx.translate(82,-68); ctx.rotate(v('earR')); blit(SPR.ear); ctx.restore();
  blit(SPR.head); drawFace();
  if(leafOn){ ctx.fillStyle='#7fb04f'; ctx.beginPath(); leafShape(ctx,-8,-90,-.25,44,6); ctx.fill(); ctx.strokeStyle='#4f8243'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-8,-90); ctx.lineTo(34,-101); ctx.stroke(); }
  ctx.restore();

function drawParts(dt,glow){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; const isGlow=p.k==='spark'; if(isGlow!==glow) continue;
    p.life+=dt; if(p.life>p.max){parts.splice(i,1); continue;}
    const f=p.life/p.max;
    if(p.k==='leaf'){
      if(!p.rest){ p.x+=(p.vx+(p.straight?0:sin(p.life*2.2+p.ph)*26))*dt; p.y+=p.vy*dt; p.r+=p.vr*dt+(p.straight?0:cos(p.life*2.2+p.ph)*.03); p.vx*=.99; if(p.vy<50) p.vy+=60*dt;
        if(p.y>GY+20+p.ph*12){p.rest=1; p.max=Math.min(p.max,p.life+5);}
        if(!leafOn&&!act&&!sleeping&&Math.abs(v('rot'))<.1){ const h=worldOf(headPt(8,-90)); if(Math.abs(p.x-h.x)<52*PS&&Math.abs(p.y-h.y)<12*PS){ leafOn={t:0}; parts.splice(i,1); continue; } } }
      ctx.globalAlpha=p.rest?clamp((p.max-p.life)/2,0,1):1; ctx.fillStyle=NEARC.leaf[p.c]; ctx.beginPath(); leafShape(ctx,p.x,p.y,p.r,p.s,p.s*.14); ctx.fill(); ctx.globalAlpha=1;
    } else if(p.k==='puff'){

    } else if(p.k==='crumb'){

function updFly(t,dt){
  const nose=worldOf(headPt(0,8));

  bf.flee-=dt; bf.tt-=dt;
  if(ptr&&ptr.mode==='bg'&&now-ptr.t0>.15){ bf.tx=ptr.x; bf.ty=ptr.y-30; bf.tt=1.5; }
  else if(bf.want&&bf.flee<=0){ bf.tx=nose.x; bf.ty=nose.y-6*PS; }
  else if(bf.tt<=0){ bf.tt=rr(3,7); bf.tx=rr(W*.08,W*.92); bf.ty=rr(GY-620,GY-180); if(rnd()<.07&&bf.flee<=0) bf.want=true; }

  bf.x+=bf.vx*dt+sin(t*5.3)*18*dt; bf.y+=bf.vy*dt+cos(t*7.1)*26*dt;

function drawFly(t){

    ctx.fillStyle='#f7c873'; ctx.beginPath(); ctx.ellipse(5.5,4.5,5.5,4.6,.5,0,TAU); ctx.fill();

let now=0, last=0, ambientT=4.2;
function wanderOnOwn(){
  // The opening is intentional: within a few seconds he takes a walk,
  // then attempts the bamboo and falls on his fluffy backside.
  if(RM){if(autoSeq%2===0)START.snack();else START.stretch();}
  else if(autoSeq===0)START.waddle(1);
  else if(autoSeq===1)START.climb();
  else if(autoSeq===2)START.flop(-1);
  else{
    const r=rnd();
    if(r<.21)START.waddle(rnd()<.5?-1:1);
    else if(r<.38)START.climb();
    else if(r<.53)START.flop(rnd()<.5?-1:1);
    else if(r<.70)START.snack();
    else if(r<.83)START.stretch();
    else if(r<.92)START.eyes();

  }
  autoSeq++;
}
function frame(ms){
  requestAnimationFrame(frame);
  const tt=ms/1000, dt=Math.min(.05,tt-last||.016); last=tt; now=tt; const t=tt;

  // behaviour

      parts.push({k:'leaf',x,y:rr(250,550),vx:rr(-14,14),vy:rr(24,46),r:rr(-2,2),vr:rr(-1,1),life:0,max:12,s:rr(18,28)*PS,ph:rr(0,6),c:(rnd()*3)|0});

  if(n>.05){ ctx.fillStyle='#fff'; for(const s of stars){ ctx.globalAlpha=n*(.55+.45*sin(t*1.3+s.ph)); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill(); } ctx.globalAlpha=1; }
  ctx.fillStyle=radial(ctx,SUNX,SUNY,270,css(cur.sun,.6*(1-n*.6)),css(cur.sun,0)); ctx.fillRect(SUNX-270,SUNY-270,540,540);
  ctx.fillStyle=css(cur.sun); ctx.beginPath(); ctx.arc(SUNX,SUNY,46,0,TAU); ctx.fill();
  if(n>.02){ ctx.fillStyle=css(cur.top,n); ctx.beginPath(); ctx.arc(SUNX+20,SUNY-11,41,0,TAU); ctx.fill(); }

    ctx.save();ctx.translate(x,c.y);ctx.scale(1,.48);
    ctx.fillStyle=radial(ctx,0,0,c.r*1.35,`rgba(255,255,250,${c.a*(1-n)})`,'rgba(255,255,250,0)');

    ctx.fillStyle=radial(ctx,SUNX,SUNY,240,`rgba(190,205,255,${.34*n})`,'rgba(190,205,255,0)'); ctx.fillRect(SUNX-240,SUNY-240,480,480);

function resize(){

let rz=0; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(resize,120); });

function start(d){

  pal(); buildSprites(); resize(); requestAnimationFrame(frame);
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({tod}));
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
window.__panda={START,get act(){return act}};
})();
